name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per command
        default: "20"
      install_runs:
        description: Runs per install command
        default: "5"
  pull_request:
    paths:
      - benchmarks/**
      - .github/workflows/benchmarks.yml

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - name: Install hyperfine and fnm (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine
          dir="$RUNNER_TEMP/fnm"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/fnm.zip" https://github.com/Schniz/fnm/releases/latest/download/fnm-linux.zip
          unzip -q "$dir/fnm.zip" -d "$dir"
          chmod +x "$dir/fnm"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Install hyperfine and fnm (macOS)
        if: runner.os == 'macOS'
        run: brew install hyperfine fnm
      - name: Build rnm
        run: cargo build --release --locked
      # Node.js archives, index files and the nvm clone. run.sh pins the
      # versions, so its hash is the key.
      - uses: actions/cache@v6
        with:
          path: benchmarks/.cache
          key: benchmarks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmarks/run.sh') }}
      - name: Run benchmarks
        run: benchmarks/run.sh --out benchmarks/results
        env:
          BENCH_RUNS: ${{ inputs.runs || '20' }}
          BENCH_INSTALL_RUNS: ${{ inputs.install_runs || '5' }}
      - name: Summary
        if: always()
        run: |
          if [ -f benchmarks/results/results.md ]; then
            cat benchmarks/results/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmarks-${{ matrix.os }}
          path: benchmarks/results
          if-no-files-found: ignore
