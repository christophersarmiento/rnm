name: Nightly

# Builds `dev` once a day when it changed since the last nightly, and replaces
# the `nightly` prerelease. GitHub runs scheduled workflows from the default
# branch, so this file must be on that branch; it always builds `dev`.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if dev has not changed.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git rev-parse HEAD)
          published=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          version="$cargo_version-nightly.$(date -u +%Y%m%d)+${sha::7}"
          changed=false
          if [ "$sha" != "$published" ] || [ "$FORCE" = true ]; then changed=true; fi
          echo "dev is at $sha; the nightly tag is at ${published:-nothing}; changed=$changed"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      version: ${{ needs.check.outputs.version }}

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.check.outputs.sha }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS
      - name: Replace the nightly release
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly $VERSION" \
            --notes "Built from \`dev\` at $SHA. Nightly builds are untested prereleases; use a tagged release for anything that matters."
