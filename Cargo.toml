[package]
name = "rnm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A fast, lightweight Node.js version manager compatible with nvm"
license = "GPL-3.0-only"
repository = "https://github.com/christophersarmiento/rnm"
readme = false
keywords = ["node", "nodejs", "nvm", "version-manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive", "string"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
flate2 = "1.1.10"
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["std", "optimization", "xz"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.4.2", features = ["platform-verifier"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
